[server]
#hostname = "gw.wso2.com"
hostname = "localhost"
node_ip = "127.0.0.1"
server_role = "gateway-worker"
offset=3

[user_store]
type = "database"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

# [database.shared_db]
# type = "mysql"
# hostname = "shared_db.mysql"
# name = "shared_db"
# port = "3306"
# username = "shareduser"
# password = "shareduser"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://127.0.0.1:3316/WSO2AM_SHARED_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

# key manager implementation
[apim.key_manager]
service_url = "https://localhost:9444/services/"
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
#pool.init_idle_capacity=50
#pool.max_idle=100
#custom_key_validation_handler="org.wso2.carbon.apimgt.keymgt.handlers.DefaultKeyValidationHandler"

# Traffic Manager configurations
[apim.throttling]
username= "$ref{super_admin.username}"
password= "$ref{super_admin.password}"

enable_unlimited_tier = true
enable_header_based_throttling = false
enable_jwt_claim_based_throttling = false
enable_query_param_based_throttling = false

# throttle_decision_endpoints = ["tcp://tm1.local:5672","tcp://tm2.local:5672"]
throttle_decision_endpoints = ["tcp://localhost:5672"]

[[apim.throttling.url_group]]
# Points to the TM's Data Receiver port
traffic_manager_urls = ["tcp://localhost:9611"]
# Points to the TM's Authenticated Data Receiver port
traffic_manager_auth_urls = ["ssl://localhost:9711"]

# [[apim.throttling.url_group]]
# traffic_manager_urls=["tcp://tm1.local:9611"]
# traffic_manager_auth_urls=["ssl://tm1.local:9711"]

# [[apim.throttling.url_group]]
# traffic_manager_urls=["tcp://tm2.local:9611"]
# traffic_manager_auth_urls=["ssl://tm2.local:9711"]

[apim.analytics]
username= "$ref{super_admin.username}"
password= "$ref{super_admin.password}"

[[apim.analytics.analytics_node]]
analytics_url="tcp://analytics1.local:7612"
analytics_auth_url="ssl://analytics1.local:7712"

[[apim.analytics.analytics_node]]
analytics_url="tcp://analytics2.local:7612"
analytics_auth_url="ssl://analytics2.local:7712"

[apim.cache.gateway_token]
enable = true
expiry_time = 15

[apim.cache.resource]
enable = true

[apim.oauth_config]
remove_outbound_auth_header = true
auth_header = "Authorization"

[apim.cors]
allow_origins = "*"
allow_methods = ["GET","PUT","POST","DELETE","PATCH","OPTIONS"]
allow_headers = ["authorization","Access-Control-Allow-Origin","Content-Type","SOAPAction"]
allow_credentials = false

