[database.apim_db]
type = "mysql"
url = "jdbc:mysql://127.0.0.1:3316/WSO2AM_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://127.0.0.1:3316/WSO2AM_SHARED_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

# [[apim.gateway.environment]]
# name= "Production and Sandbox"
# type= "hybrid"
# display_in_api_console= true
# description= "This is a hybrid gateway that handles both production and sandbox token traffic."
# service_url= "https://gw.mgt.wso2.com:443/services/"
# username= "${admin.username}"
# password= "${admin.password}"
# http_endpoint = "http://api.gw.wso2.com:8280/"
# https_endpoint = "https://api.gw.wso2.com:8243/"

[[apim.gateway.environment]]
name = "Production and Sandbox"
type = "hybrid"
display_in_api_console = true
description = "This is a hybrid gateway that handles both production and sandbox token traffic."
show_as_token_endpoint_url = true
service_url = "https://localhost:9446/services/"  # Base 9443 + 3
username= "${admin.username}"
password= "${admin.password}"
ws_endpoint = "ws://localhost:9099"
wss_endpoint = "wss://localhost:8099"
http_endpoint = "http://localhost:8283"  # Base 8280 + 3
https_endpoint = "https://localhost:8246" # Base 8243 + 3


[apim.analytics]
store_api_url = "https://analytics.wso2.com:7444"
username= "$ref{super_admin.username}"
password= "$ref{super_admin.password}"

[[apim.analytics.analytics_node]]
analytics_url="tcp://analytic1.local:7612"
analytics_auth_url="ssl://analytic1.local:7712"

[[apim.analytics.analytics_node]]
analytics_url="tcp://analytic2.local:7612"
analytics_auth_url="ssl://analytic2.local:7712"

# Traffic Manager configurations
# [apim.throttling]
# service_url = "https://tm.wso2.com:443/services/"
# username= "$ref{super_admin.username}"
# password= "$ref{super_admin.password}"

# [[apim.throttling.url_group]]
# traffic_manager_urls=["tcp://tm1.local:9611"]
# traffic_manager_auth_urls=["ssl://tm1.local:9711"]

# [[apim.throttling.url_group]]
# traffic_manager_urls=["tcp://tm2.local:9611"]
# traffic_manager_auth_urls=["ssl://tm2.local:9711"]

[apim.throttling]
service_url = "https://localhost:9443/services/"
throttle_decision_endpoints = ["tcp://localhost:5672"]

[[apim.throttling.url_group]]
# Points to the TM's Data Receiver port
traffic_manager_urls = ["tcp://localhost:9611"]
# Points to the TM's Authenticated Data Receiver port
traffic_manager_auth_urls = ["ssl://localhost:9711"]

[apim.cache.scopes]
enable = true

[apim.cache.publisher_roles] #check the usage and move to dev role
enable = true

[apim.devportal]
url = "https://localhost:9447/devportal"  # Base 9443 + 4

[apim.workflow]
enable = false
service_url = "https://localhost:9445/bpmn"
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
callback_endpoint = "https://localhost:9443/api/am/publisher/v0.15/workflows/update-workflow-status"
token_endpoint = "https://localhost:8243/token"
client_registration_endpoint = "https://localhost:9443/client-registration/v0.15/register"
client_registration_username = "$ref{super_admin.username}"
client_registration_password = "$ref{super_admin.password}"
