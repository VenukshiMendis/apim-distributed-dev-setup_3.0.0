[server]
#hostname = "publisher.wso2.com"
hostname = "localhost"
node_ip = "127.0.0.1"
server_role = "api-publisher"
offset=2

[user_store]
type = "database"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

# [database.apim_db]
